<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>franky — A2UI surface</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #26272e; --border: #3a3b44;
    --fg: #e4e4e9; --dim: #9a9aa5; --accent: #6d9eeb; --accent-dim: #3d5a94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #conn { font-size: 12px; color: var(--dim); }
  #conn.live { color: #7bc47f; }
  #conn.down { color: #e57373; }
  #surface { max-width: 720px; margin: 0 auto; }
  .empty { color: var(--dim); text-align: center; padding: 64px 0; }
  /* A2UI components */
  .a2-column { display: flex; flex-direction: column; gap: 12px; }
  .a2-row { display: flex; flex-direction: row; gap: 12px; align-items: center; flex-wrap: wrap; }
  .a2-text { margin: 0; white-space: pre-wrap; }
  .a2-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .a2-button {
    background: var(--accent-dim); color: #fff; border: 1px solid var(--accent);
    border-radius: 6px; padding: 7px 16px; font-size: 14px; cursor: pointer;
  }
  .a2-button:hover { background: var(--accent); }
  .a2-field { display: flex; flex-direction: column; gap: 4px; }
  .a2-field label { font-size: 12px; color: var(--dim); }
  .a2-field input {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 14px;
  }
  .a2-field input:focus { outline: none; border-color: var(--accent); }
  .a2-check { display: flex; flex-direction: row; gap: 8px; align-items: center; }
  .a2-check label { font-size: 13px; color: var(--fg); }
  .a2-check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .a2-card-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .a2-card-box > .a2-card-title { margin: 0; font-size: 14px; font-weight: 600; }
  .a2-card-box > .a2-card-sub { margin: -8px 0 0; font-size: 12px; color: var(--dim); white-space: pre-wrap; }
  .a2-code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; margin: 0; overflow-x: auto;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .a2-toolcall { display: flex; flex-direction: column; gap: 8px; }
  .a2-toolcall-head { display: flex; align-items: center; gap: 8px; }
  .a2-toolcall-badge {
    font-size: 11px; padding: 1px 8px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--dim);
  }
  .a2-toolcall-running .a2-toolcall-badge { color: var(--accent); border-color: var(--accent); }
  .a2-toolcall-done .a2-toolcall-badge { color: #7bc47f; border-color: #7bc47f; }
  .a2-toolcall-error .a2-toolcall-badge { color: #e57373; border-color: #e57373; }
  .a2-toolcall-name { font-weight: 600; font-size: 13px; }
  .a2-toolcall-result { max-height: 240px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>franky · A2UI surface <code>main</code></h1>
  <span id="conn">connecting…</span>
</header>
<div id="surface"><div class="empty">No UI yet — ask the agent to render something (e.g. “show me a form”).</div></div>

<script>
"use strict";
// ── A2UI PoC renderer ─────────────────────────────────────────────
// Consumes franky's /a2ui/events SSE stream (A2UI v1.0 envelopes) and
// renders the Basic-catalog subset: Column, Row, Text, Button,
// TextField. Data bindings: {"@path": "/json/pointer"} against the
// surface data model (RFC 6901). Two-way binding is local per spec;
// state goes back to the agent only via Button actions
// (POST /a2ui/action → appended to the agent transcript).

const state = { components: [], dataModel: null, version: 0 };
const surfaceEl = document.getElementById("surface");
const connEl = document.getElementById("conn");

// ── JSON Pointer (RFC 6901) ───────────────────────────────────────
function pointerGet(obj, path) {
  if (!path || path === "/") return obj;
  let cur = obj;
  for (const raw of path.split("/").slice(1)) {
    const seg = raw.replace(/~1/g, "/").replace(/~0/g, "~");
    if (cur == null || typeof cur !== "object") return undefined;
    cur = Array.isArray(cur) ? cur[Number(seg)] : cur[seg];
  }
  return cur;
}
function pointerSet(obj, path, value) {
  const segs = path.split("/").slice(1).map(s => s.replace(/~1/g, "/").replace(/~0/g, "~"));
  if (segs.length === 0) return value;
  let cur = obj;
  for (let i = 0; i < segs.length - 1; i++) {
    if (cur[segs[i]] == null || typeof cur[segs[i]] !== "object") cur[segs[i]] = {};
    cur = cur[segs[i]];
  }
  cur[segs[segs.length - 1]] = value;
  return obj;
}

function resolveDynamic(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "object" && typeof v["@path"] === "string") {
    const r = pointerGet(state.dataModel, v["@path"]);
    if (r == null) return "";
    return typeof r === "object" ? JSON.stringify(r) : String(r);
  }
  return String(v);
}
// Resolve an action context: {"k": {"@path": "/..."}} → {"k": value}
function resolveContext(ctx) {
  const out = {};
  for (const [k, v] of Object.entries(ctx || {})) {
    out[k] = (v && typeof v === "object" && typeof v["@path"] === "string")
      ? pointerGet(state.dataModel, v["@path"]) : v;
  }
  return out;
}

// ── component renderers ───────────────────────────────────────────
const renderers = {
  Column(def, render) {
    const el = document.createElement("div");
    el.className = "a2-column a2-card";
    for (const kid of def.children || []) render(kid, el);
    return el;
  },
  Row(def, render) {
    const el = document.createElement("div");
    el.className = "a2-row";
    for (const kid of def.children || []) render(kid, el);
    return el;
  },
  Text(def) {
    const el = document.createElement("p");
    el.className = "a2-text";
    el.textContent = resolveDynamic(def.text);
    return el;
  },
  Button(def) {
    const el = document.createElement("button");
    el.className = "a2-button";
    el.textContent = resolveDynamic(def.label);
    el.addEventListener("click", () => fireAction(def));
    return el;
  },
  TextField(def) {
    const wrap = document.createElement("div");
    wrap.className = "a2-field";
    const label = document.createElement("label");
    label.textContent = resolveDynamic(def.label);
    const input = document.createElement("input");
    input.type = "text";
    const binding = def.value && def.value["@path"];
    if (binding) {
      const cur = pointerGet(state.dataModel, binding);
      input.value = cur == null ? "" : String(cur);
      // Two-way binding, renderer-local per spec.
      input.addEventListener("input", () => {
        if (state.dataModel == null || typeof state.dataModel !== "object") state.dataModel = {};
        pointerSet(state.dataModel, binding, input.value);
      });
    }
    wrap.append(label, input);
    return wrap;
  },
  CheckBox(def) {
    const wrap = document.createElement("div");
    wrap.className = "a2-check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = "a2cb-" + def.id;
    const label = document.createElement("label");
    label.htmlFor = input.id;
    label.textContent = resolveDynamic(def.label);
    const binding = def.checked && typeof def.checked === "object" ? def.checked["@path"] : null;
    if (binding) {
      const cur = pointerGet(state.dataModel, binding);
      input.checked = cur === true;
      // Two-way binding, renderer-local per spec.
      input.addEventListener("change", () => {
        if (state.dataModel == null || typeof state.dataModel !== "object") state.dataModel = {};
        pointerSet(state.dataModel, binding, input.checked);
      });
    } else {
      input.checked = def.checked === true;
    }
    wrap.append(input, label);
    return wrap;
  },
  Card(def, render) {
    const el = document.createElement("div");
    el.className = "a2-card-box";
    if (def.title != null) {
      const t = document.createElement("p");
      t.className = "a2-card-title";
      t.textContent = resolveDynamic(def.title);
      el.appendChild(t);
    }
    if (def.subtitle != null) {
      const s = document.createElement("p");
      s.className = "a2-card-sub";
      s.textContent = resolveDynamic(def.subtitle);
      el.appendChild(s);
    }
    for (const kid of def.children || []) render(kid, el);
    return el;
  },
  // Plan 4.7 franky catalog: tool invocation card.
  ToolCall(def) {
    const el = document.createElement("div");
    const status = typeof def.status === "string" ? def.status : "done";
    el.className = "a2-toolcall a2-toolcall-" + status;
    const head = document.createElement("div");
    head.className = "a2-toolcall-head";
    const badge = document.createElement("span");
    badge.className = "a2-toolcall-badge";
    badge.textContent = status === "running" ? "running" : status === "error" ? "error" : "done";
    const name = document.createElement("span");
    name.className = "a2-toolcall-name";
    name.textContent = resolveDynamic(def.name);
    head.append(badge, name);
    el.appendChild(head);
    if (def.args != null) {
      const args = document.createElement("pre");
      args.className = "a2-code a2-toolcall-args";
      args.textContent = resolveDynamic(def.args);
      el.appendChild(args);
    }
    if (def.result != null) {
      const result = document.createElement("pre");
      result.className = "a2-code a2-toolcall-result";
      result.textContent = resolveDynamic(def.result);
      el.appendChild(result);
    }
    return el;
  },
  // Plan 4.7 franky catalog: monospace code block.
  CodeBlock(def) {
    const el = document.createElement("pre");
    el.className = "a2-code";
    if (def.lang != null) el.dataset.lang = resolveDynamic(def.lang);
    el.textContent = resolveDynamic(def.code);
    return el;
  },
};

function render() {
  surfaceEl.textContent = "";
  if (!state.components.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "No UI yet — ask the agent to render something (e.g. “show me a form”).";
    surfaceEl.appendChild(d);
    return;
  }
  const byId = new Map(state.components.map(c => [c.id, c]));
  const renderInto = (id, parent) => {
    const def = byId.get(id);
    if (!def) return; // dangling reference (id not in this surface)
    const r = renderers[def.component];
    if (!r) {
      const w = document.createElement("div");
      w.className = "a2-text";
      w.textContent = `[unsupported component: ${def.component}]`;
      parent.appendChild(w);
      return;
    }
    parent.appendChild(r(def, renderInto));
  };
  if (byId.has("root")) {
    // Model-driven tree rooted at "root"; any unattached components
    // (e.g. host-injected permission cards) render after it.
    const attached = new Set();
    (function mark(id) {
      if (!id || attached.has(id)) return;
      attached.add(id);
      const def = byId.get(id);
      if (!def) return;
      for (const k of def.children || []) mark(k);
      if (def.child) mark(def.child);
    })("root");
    renderInto("root", surfaceEl);
    for (const c of state.components) {
      if (!attached.has(c.id)) renderInto(c.id, surfaceEl);
    }
  } else {
    // No "root" component (host-injected UI only) — render in list order.
    for (const c of state.components) renderInto(c.id, surfaceEl);
  }
}

// ── actions → agent ───────────────────────────────────────────────
async function fireAction(def) {
  const ev = (def.action && def.action.event) || {};
  const payload = {
    version: "1.0",
    action: {
      name: ev.name || "unknown",
      surfaceId: "main",
      sourceComponentId: def.id,
      timestamp: new Date().toISOString(),
      userMessage: resolveDynamic(ev.userMessage) || undefined,
      context: resolveContext(ev.context),
    },
  };
  try {
    await fetch("/a2ui/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    console.error("action POST failed", e);
  }
}

// ── envelopes ─────────────────────────────────────────────────────
function deepMerge(dst, src) {
  for (const [k, v] of Object.entries(src || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) &&
        dst[k] && typeof dst[k] === "object" && !Array.isArray(dst[k])) {
      deepMerge(dst[k], v);
    } else {
      dst[k] = v;
    }
  }
  return dst;
}

function applyEnvelope(env) {
  if (env.createSurface) return; // surface is implicit in the PoC
  if (env.updateComponents) {
    // Upsert semantics: components with a matching id are replaced in
    // place, new ids append; ids absent from the batch are kept. This
    // lets host-side projections (permission cards) and incremental
    // updates coexist with full-tree model renders (a full render
    // always includes every id it manages, so it still converges).
    const batch = env.updateComponents.components || [];
    const byId = new Map(state.components.map((c, i) => [c.id, i]));
    for (const c of batch) {
      const idx = byId.get(c.id);
      if (idx === undefined) {
        byId.set(c.id, state.components.length);
        state.components.push(c);
      } else {
        state.components[idx] = c;
      }
    }
    render();
    return;
  }
  if (env.updateDataModel) {
    if (state.dataModel == null || typeof state.dataModel !== "object") state.dataModel = {};
    deepMerge(state.dataModel, env.updateDataModel.data || {});
    render(); // re-resolve @path bindings
    return;
  }
  if (env.deleteSurface) {
    state.components = [];
    state.dataModel = null;
    render();
  }
}

// ── SSE wiring with reconnect + snapshot catch-up ─────────────────
let es = null;
function connect() {
  es = new EventSource("/a2ui/events");
  es.addEventListener("a2ui_snapshot", (e) => {
    const snap = JSON.parse(e.data);
    state.components = snap.components || [];
    state.dataModel = snap.dataModel;
    state.version = snap.version || 0;
    render();
  });
  for (const kind of ["a2ui_updateComponents", "a2ui_updateDataModel", "a2ui_deleteSurface", "a2ui_createSurface"]) {
    es.addEventListener(kind, (e) => applyEnvelope(JSON.parse(e.data)));
  }
  es.onopen = () => { connEl.textContent = "live"; connEl.className = "live"; };
  es.onerror = () => { connEl.textContent = "reconnecting…"; connEl.className = "down"; };
  // EventSource auto-reconnects and resends Last-Event-ID; the server
  // answers a stale id with a fresh snapshot.
}
connect();
</script>
</body>
</html>

version: 2

project_name: franky

builds:
  - id: release
    builder: zig
    command: build
    targets:
      - x86_64-linux-gnu
      - aarch64-linux-gnu
      - x86-linux-gnu
      - x86_64-macos
      - aarch64-macos
    flags:
      - -Doptimize=ReleaseSafe
      - -Dversion={{ .Version }}
      - -Dcommit={{ .ShortCommit }}
      - -Ddate={{ .CommitDate }}
  - id: debug
    builder: zig
    command: build
    targets:
      - x86_64-linux-gnu
      - aarch64-linux-gnu
      - x86-linux-gnu
      - x86_64-macos
      - aarch64-macos
    flags:
      - -Doptimize=Debug
      - -Dstrip=true
      - -Dversion={{ .Version }}
      - -Dcommit={{ .ShortCommit }}
      - -Ddate={{ .CommitDate }}
    # NOTE: -Dstrip=true omits DWARF .debug_* sections, reducing the
    # binary from ~110MB to ~56MB. The unstripped Debug binary hangs
    # under gvisor sandboxes — stripping debug info avoids the hang
    # while keeping all Debug-mode safety checks (integer overflow,
    # null deref, etc.). Source-location stacktraces are provided by
    # the custom panic handler in src/bin/main.zig, which resolves
    # addresses via DWARF when available and falls back to raw hex
    # addresses (resolvable offline with addr2line) otherwise.
archives:
  - id: release
    ids: [release]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch \"x86\" }}386{{ else }}{{ .Arch }}{{ end }}"
  - id: debug
    ids: [debug]
    formats: [binary]
    name_template: "{{ .ProjectName }}-debug_{{ .Os }}_{{ if eq .Arch \"x86\" }}386{{ else }}{{ .Arch }}{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
